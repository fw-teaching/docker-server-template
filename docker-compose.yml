services:
  server:
    build:
      context: .
      args:
        STUDENT_USER: ${STUDENT_USER:-student}
        STUDENT_PASSWORD: ${STUDENT_PASSWORD:-changeme123}
    container_name: ${STUDENT_USER:-student}-server
    environment:
      SSH_PORT: ${SSH_PORT:-22}
    ports:
      - "127.0.0.1:${SSH_PORT:-22}:22"
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - home_data:/home
    restart: unless-stopped

volumes:
  home_data:
